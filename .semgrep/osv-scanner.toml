[[IgnoredVulns]]
id = "GHSA-53pm-wgxf-c6qf"
effectiveUntil = 2027-01-05T00:00:00Z
reason = "wcmatch 8.5.2 (polynomial-time ReDoS when matching untrusted names against multi-star patterns). Fixed in 11.2; Semgrep 1.185.0 requires wcmatch~=8.3 and so does 1.186.0, the latest. Semgrep matches only the paths of the checkout it scans against the fixed in-tree excludes in scripts/gates/semgrep-scan.sh, none of them multi-star; the worst case is a slower scan, bounded by the job timeout."
