# OSV-Scanner configuration for .semgrep/requirements.txt, the hash-locked
# Semgrep engine. The scanner reads the osv-scanner.toml next to each lockfile,
# not the one at the repository root, so these entries live here.
#
# Each entry is a Medium advisory with no fix reachable inside the ranges
# Semgrep declares, up to its latest release. The workflows only ever run
# `semgrep scan` over this repository, with --metrics=off and without --trace.
# When `effectiveUntil` passes the scan reports them again, so the decision is
# revisited instead of becoming permanent: by then Semgrep may allow mcp 1.30,
# opentelemetry-api 1.45 and wcmatch 11.2, and the fix is regenerating the lock.

[[IgnoredVulns]]
id = "GHSA-qx49-fqc8-xw99"
effectiveUntil = 2027-01-05T00:00:00Z
reason = "mcp 1.29.0 (OAuth client could send credentials to an authorization server chosen by the MCP server). Fixed in 1.30.0; Semgrep 1.185.0 pins mcp==1.29.0. Semgrep only serves MCP, under `semgrep mcp`, which no workflow runs; it never acts as an MCP or OAuth client."

[[IgnoredVulns]]
id = "GHSA-5h93-6whr-6q8j"
