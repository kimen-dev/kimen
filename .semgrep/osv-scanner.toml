reason = "mcp 1.29.0 (HTTP and SSE client transports follow cross-origin redirects with custom headers). Fixed in 1.30.0; Semgrep 1.185.0 pins mcp==1.29.0 and so does 1.186.0, the latest. Semgrep only serves MCP, under `semgrep mcp`, which no workflow runs; it never opens an MCP client connection."

