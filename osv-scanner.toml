# OSV-Scanner configuration (read by `osv-scanner scan --recursive ./` in
# .github/workflows/security.yml for the lockfiles in this directory:
# pnpm-lock.yaml).
#
# The scanner filters each lockfile with the osv-scanner.toml in that
# lockfile's own directory and never falls back to a parent's, so entries for
# .semgrep/requirements.txt live in .semgrep/osv-scanner.toml.
#
# Each entry is a Medium advisory with no fix reachable inside the declared
# ranges of the packages that pull it in. They are ignored with a reason and an
# expiry: when `effectiveUntil` passes the scan reports them again, so the
# decision is revisited instead of becoming permanent.

