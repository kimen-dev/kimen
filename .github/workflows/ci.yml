# One required result: the `quality` job, green only when every part of the
# suite that should run passed. The suite is split into jobs that run side by
# side: `core` runs gates-core.sh, and the `browser` shards together run
# gates-browser.sh chromium. That is exactly gates-suite.sh, the command that
# defines local readiness, cut along its own two gates and the elements
# suite's files so the slowest part sets the time, not the sum.
#
# Each pull request and merge group is classified first
# (scripts/gates/classify-ci-scope.mjs):
#   - shared infrastructure (root config, pnpm-lock.yaml, nx.json,
#     tsconfig.base.json, scripts/gates, scripts/lib, the workflows...) or an
#     unknown path runs the complete suite;
#   - any other change runs the same jobs in the affected scope
#     (scripts/gates/select-affected.mjs): every repository-wide gate still
#     runs, while lint, budgets, unit tests and each browser suite cover only
#     the projects Nx reports affected between the change's base and head;
#   - dependency and workflow maintenance keep their focused paths on pull
#     requests only, so the queue runs them in full; sandbox dependency
#     maintenance belongs to containment.yml.
# A push to main runs nothing here: the merge queue already tested the exact
# tree that lands. The nightly run, and any manual dispatch, runs the
# complete suite on main, the safety net for what the Nx graph does not model.
# Heavy or low-frequency controls live in dedicated workflows.
name: ci

on:
  pull_request:
  # The merge queue tests each group against the latest main before it lands.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '23 4 * * *' # nightly, 04:23 UTC: the complete suite on main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            cdn.playwright.dev:443
            playwright.azureedge.net:443
            playwright.download.prss.microsoft.com:443
            packages.microsoft.com:443
            dl.google.com:443
            azure.archive.ubuntu.com:80
            storage.googleapis.com:443
            archive.ubuntu.com:443
            security.ubuntu.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Writes scope, and for a pull request or merge group its base and head.
      # Schedule and dispatch are always full. A scope this workflow does not
      # know would skip every step below and pass, so it fails here instead.
      - name: Classify the change
        id: scope
        run: |
          node scripts/gates/classify-ci-scope.mjs --github-event >"$RUNNER_TEMP/scope.out"
          cat "$RUNNER_TEMP/scope.out"
          grep -Eqx 'scope=(full|affected|dependencies|workflows|sandbox)' "$RUNNER_TEMP/scope.out"
          cat "$RUNNER_TEMP/scope.out" >>"$GITHUB_OUTPUT"

      # The scan itself is a gate inside gates-core.sh, not a step here, so the
      # command that defines local readiness runs exactly what this job does.
      # Only the engine is installed here: on a runner it is not on PATH, and
      # the gate would otherwise fetch it through uvx on every run.
      #
      # It scans the vendored ruleset (.semgrep/) rather than the registry, so
      # the required check stays a pure function of the tree — `p/default`
      # resolves server-side, and an upstream rule change could otherwise
      # redden a pull request that changed nothing (Art. X). security.yml keeps
      # the live registry on its schedule: the pinned set blocks, the live set
      # explores.
      - name: Install Semgrep (hash-locked)
        if: >-
          steps.scope.outputs.scope == 'full' ||
          steps.scope.outputs.scope == 'affected'
        run: bash scripts/gates/install-semgrep.sh "$RUNNER_TEMP/semgrep"

      # The cross-device regressions (cache-env-reentry, site-publication)
      # require the caller to designate TMPDIR on a filesystem other than the
      # checkout's; the hosted runner sets none, so the job mounts a private
      # tmpfs and designates it, exactly as a local tmpfs /tmp would.
      - name: Designate a temporary directory on its own filesystem
        if: >-
          steps.scope.outputs.scope == 'full' ||
          steps.scope.outputs.scope == 'affected' ||
          steps.scope.outputs.scope == 'dependencies'
        run: |
          sudo mkdir -p /mnt/kimen-tmp
          sudo mount -t tmpfs -o size=4g,mode=1777 tmpfs /mnt/kimen-tmp
          printf 'TMPDIR=%s\n' /mnt/kimen-tmp >>"$GITHUB_ENV"

      - name: Allocate isolated writable caches
        if: >-
          steps.scope.outputs.scope == 'full' ||
          steps.scope.outputs.scope == 'affected' ||
          steps.scope.outputs.scope == 'dependencies'
        run: bash scripts/gates/cache-env.sh --github-env "$GITHUB_ENV"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: >-
          steps.scope.outputs.scope == 'full' ||
          steps.scope.outputs.scope == 'affected' ||
          steps.scope.outputs.scope == 'dependencies'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: ${{ (steps.scope.outputs.scope == 'full' || steps.scope.outputs.scope == 'affected' || steps.scope.outputs.scope == 'dependencies') && 'pnpm' || '' }}

      - name: Install
        if: >-
          steps.scope.outputs.scope == 'full' ||
          steps.scope.outputs.scope == 'affected' ||
          steps.scope.outputs.scope == 'dependencies'
        run: pnpm install --frozen-lockfile

      # Exports KIMEN_GATE_SCOPE and the affected lists to the steps below; it
      # widens to the complete suite itself if anything about the range is off.
      - name: Select the affected projects
        if: steps.scope.outputs.scope == 'affected'
        env:
          KIMEN_BASE_SHA: ${{ steps.scope.outputs.base }}
          KIMEN_HEAD_SHA: ${{ steps.scope.outputs.head }}
        run: |
          node scripts/gates/select-affected.mjs --base "$KIMEN_BASE_SHA" --head "$KIMEN_HEAD_SHA" >"$RUNNER_TEMP/affected.env"
          cat "$RUNNER_TEMP/affected.env"
          cat "$RUNNER_TEMP/affected.env" >>"$GITHUB_ENV"

      - name: Detect browser-sensitive dependency changes
        if: steps.scope.outputs.scope == 'dependencies'
        id: browser-impact
        env:
          KIMEN_BASE_SHA: ${{ steps.scope.outputs.base }}
          KIMEN_HEAD_SHA: ${{ steps.scope.outputs.head }}
        run: |
          needed="$(node scripts/gates/dependency-browser-impact.mjs --base "$KIMEN_BASE_SHA" --head "$KIMEN_HEAD_SHA")"
          printf 'needed=%s\n' "$needed" >>"$GITHUB_OUTPUT"

      # The suite's browser gate runs in the `browser` jobs; only the
      # dependency path, which runs its affected browser gate here, needs one.
      - name: Install Chromium
        if: steps.browser-impact.outputs.needed == 'true'
        run: pnpm --filter @kimen/elements exec playwright install --with-deps chromium

      - name: Core quality
        if: >-
          steps.scope.outputs.scope == 'full' ||
          steps.scope.outputs.scope == 'affected'
        run: bash scripts/gates/gates-core.sh

      - name: Affected dependency quality
        if: steps.scope.outputs.scope == 'dependencies'
        run: >-
          bash scripts/gates/gates-dependencies.sh
          "${{ steps.scope.outputs.base }}"
          "${{ steps.scope.outputs.head }}"

      - name: Workflow maintenance quality
        if: steps.scope.outputs.scope == 'workflows'
        run: |
          node scripts/gates/check-workflows.mjs
          node --test scripts/tests/governance-80-20.test.mjs

      - name: Sandbox dependency handoff quality
        if: steps.scope.outputs.scope == 'sandbox'
        run: node --test scripts/tests/sandbox-static-contract.test.mjs

  # The browser gate of the suite, its elements files split in four: each
  # shard runs a quarter of them, and the last one also the Chromium-only
  # suites (scripts/gates/gates-browser.sh). In the affected scope a shard runs
  # only the suites whose projects are affected, and a shard left with none
  # finishes at once, green; the maintenance scopes skip it.
  browser:
    name: browser (chromium ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            cdn.playwright.dev:443
            playwright.azureedge.net:443
            playwright.download.prss.microsoft.com:443
            packages.microsoft.com:443
            dl.google.com:443
            azure.archive.ubuntu.com:80
            storage.googleapis.com:443
            archive.ubuntu.com:443
            security.ubuntu.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify the change
        id: scope
        run: |
          node scripts/gates/classify-ci-scope.mjs --github-event >"$RUNNER_TEMP/scope.out"
          cat "$RUNNER_TEMP/scope.out"
          grep -Eqx 'scope=(full|affected|dependencies|workflows|sandbox)' "$RUNNER_TEMP/scope.out"
          cat "$RUNNER_TEMP/scope.out" >>"$GITHUB_OUTPUT"

      - name: Designate a temporary directory on its own filesystem
        if: >-
          steps.scope.outputs.scope == 'full' ||
          steps.scope.outputs.scope == 'affected'
        run: |
          sudo mkdir -p /mnt/kimen-tmp
          sudo mount -t tmpfs -o size=4g,mode=1777 tmpfs /mnt/kimen-tmp
          printf 'TMPDIR=%s\n' /mnt/kimen-tmp >>"$GITHUB_ENV"

      - name: Allocate isolated writable caches
        if: >-
          steps.scope.outputs.scope == 'full' ||
          steps.scope.outputs.scope == 'affected'
        run: bash scripts/gates/cache-env.sh --github-env "$GITHUB_ENV"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: >-
          steps.scope.outputs.scope == 'full' ||
          steps.scope.outputs.scope == 'affected'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: ${{ (steps.scope.outputs.scope == 'full' || steps.scope.outputs.scope == 'affected') && 'pnpm' || '' }}

      - name: Install
        if: >-
          steps.scope.outputs.scope == 'full' ||
          steps.scope.outputs.scope == 'affected'
        run: pnpm install --frozen-lockfile

      - name: Select the affected projects
        if: steps.scope.outputs.scope == 'affected'
        env:
          KIMEN_BASE_SHA: ${{ steps.scope.outputs.base }}
          KIMEN_HEAD_SHA: ${{ steps.scope.outputs.head }}
        run: |
          node scripts/gates/select-affected.mjs --base "$KIMEN_BASE_SHA" --head "$KIMEN_HEAD_SHA" >"$RUNNER_TEMP/affected.env"
          cat "$RUNNER_TEMP/affected.env"
          cat "$RUNNER_TEMP/affected.env" >>"$GITHUB_ENV"

      # The gate names this shard's suites; an empty list skips the rest.
      - name: Plan this shard
        if: >-
          steps.scope.outputs.scope == 'full' ||
          steps.scope.outputs.scope == 'affected'
        id: plan
        env:
          KIMEN_BROWSER_SHARD: ${{ matrix.shard }}/4
        run: |
          bash scripts/gates/gates-browser.sh chromium --plan >"$RUNNER_TEMP/plan.out"
          cat "$RUNNER_TEMP/plan.out"
          cat "$RUNNER_TEMP/plan.out" >>"$GITHUB_OUTPUT"

      # The Chromium build of the pinned Playwright, kept between runs under
      # the key of that exact version: a Playwright bump changes the key and
      # downloads its own build. `playwright install` still runs, so the
      # system libraries are installed and a missing or partial browser is
      # fetched.
      - name: Resolve the pinned Playwright version
        if: steps.plan.outputs.suites != ''
        id: playwright
        run: >-
          printf 'version=%s\n'
          "$(node -p "require('./packages/elements/node_modules/playwright/package.json').version")"
          >>"$GITHUB_OUTPUT"

      - name: Restore the Chromium build of this Playwright
        if: steps.plan.outputs.suites != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.plan.outputs.suites != ''
        run: pnpm --filter @kimen/elements exec playwright install --with-deps chromium

      - name: Browser quality
        if: steps.plan.outputs.suites != ''
        env:
          KIMEN_BROWSER_SHARD: ${{ matrix.shard }}/4
        run: bash scripts/gates/gates-browser.sh chromium

  # The one required result. It waits for every part and is green only when
  # each of them is; a part that was cancelled or skipped is not a pass. A
  # part with nothing to verify for a change still runs, and succeeds.
  quality:
    needs: [core, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443

      - name: Every part of the suite passed
        env:
          CORE_RESULT: ${{ needs.core.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          printf 'core: %s\nbrowser: %s\n' "$CORE_RESULT" "$BROWSER_RESULT"
          [ "$CORE_RESULT" = 'success' ] && [ "$BROWSER_RESULT" = 'success' ]
