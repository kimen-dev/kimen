# Scheduled and protected-branch security depth: SAST, dependency CVEs and
# secret scanning. PR dependency diffs use the path-scoped companion workflow.
# Actions pinned to commit SHAs; trailing comment records the resolved tag.
# Malicious-package detection on new dependencies: Socket (GitHub App, no
# workflow — installed by the founder on the org).
name: security

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            semgrep.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Engine pinned (Art. X determinism). Registry rulesets update server-side:
      # accepted for breadth; vendor rules locally if a flaky finding ever blocks.
      - name: Install Semgrep (pinned)
        run: pipx install semgrep==1.168.0

      # `.semgrep` is excluded for the same reason the pinned scan excludes it:
      # rule files carry code patterns as data, and other rules match them. On
      # this tree the live ruleset finds 6 such matches, every one of them rule
      # content rather than repository code.
      - name: Semgrep scan (findings block)
        run: >-
          semgrep scan --config p/default --error --metrics=off
          --exclude .specify --exclude .agents --exclude .claude --exclude .semgrep

  osv-scan:
    # kimen-workflow-policy: reusable-workflow-v1
    # reason: the full-SHA-pinned upstream OSV scanner owns its runner, so in-repo hardening cannot apply
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --recursive
        ./

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            gitleaks.io:443
            license.gitleaks.io:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: secrets hide in old commits

      # Org repos need GITLEAKS_LICENSE (free for OSS): founder action, see PR.
      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # The action passes --fail by default; only narrow to verified findings.
      - name: TruffleHog (verified findings block)
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --results=verified
