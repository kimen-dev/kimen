name: release-tag

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: kimen-release-tag-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tag:
    # A squash-merged release PR keeps its title as the commit title; every other
    # push skips the job instead of failing on missing App credentials.
    if: "startsWith(github.event.head_commit.message, 'chore(release): v')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443

      - name: Require release App credentials
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "$RELEASE_APP_ID" || -z "$RELEASE_APP_PRIVATE_KEY" ]]; then
            echo '::error::Release automation requires RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY.'
            exit 1
          fi

      - name: Check out the exact main push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Mint release App token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: Tag the merged release and create its GitHub Release
        env:
          RELEASE_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/release/release-github.mjs tag
