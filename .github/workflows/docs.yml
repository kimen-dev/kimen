# Kimen docs: build the Storybook workshop and publish it to GitHub Pages.
#
# Actions are pinned to commit SHAs (Art. X supply-chain determinism); the
# trailing comment records the tag each SHA was resolved from. To re-pin
# after a bump, run `bash scripts/pin-actions.sh` (needs `gh`).
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # The docs site (@kimen/docs, Astro) builds fully offline: telemetry
      # off, no remote fonts, Pagefind bundled — nothing beyond the npm
      # registry egress already allowed for install.
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build packages (tokens before elements via Nx graph)
        run: pnpm exec nx run-many -t build
        env:
          NX_TUI: "false"

      - name: Build Storybook
        run: pnpm --filter @kimen/elements build-storybook

      - name: Build docs site
        run: pnpm --filter @kimen/docs build

      - name: Assemble site (landing at /, docs under /docs/, Storybook under /storybook/)
        run: bash scripts/build-site.sh

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            uploads.github.com:443

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
