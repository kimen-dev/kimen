packages:
  - "packages/*"
  - "tools/*"
  - "site/docs"
# Transitive dependencies may not be installed from exotic/untrusted sources.
blockExoticSubdeps: true

# Supply-chain hardening (constitution Art. X)
# Wait 7 days (in minutes) before resolving newly published versions:
# malicious releases are usually caught within days.
minimumReleaseAge: 10080

# pnpm 11 fails closed when dependency build scripts have not been reviewed.
# These exact versions need their native binaries for the Nx graph and
# esbuild-backed tooling; every future version must be approved separately.
allowBuilds:
  # ng-packagr transitive; native binding serves watch mode only, which the
  # one-shot library builds never use — reviewed and DECLINED (spec 034).
  '@parcel/watcher@2.6.0': false
  'esbuild@0.28.1': true
  'nx@23.2.1': true
  # Next patch/minor of the same two packages, reviewed for the dev-dependency
  # group update: their install scripts are byte-for-byte the same commands as
  # the approved versions (esbuild `node install.js`, nx's guarded
  # post-install require), and both cleared minimumReleaseAge.
  'esbuild@0.28.2': true
  'nx@23.3.1': true

# Resolution pins. These live here and not under `pnpm.overrides` in
# package.json: pnpm 10 stopped reading that field, and a pin it does not read
# is a defence that exists on paper and not in the tree. `qs` sat there
# unenforced — the lockfile happens to hold the intended version, but nothing
# was holding it.
#
# The rest close advisories in transitive packages, which nothing in this
# workspace declares directly, so an override is the only lever. Every pinned
# version cleared minimumReleaseAge before being added.
overrides:
  # GHSA-42h9-826w-cgv3 and nine more, 1.16.0 → 1.18.0; then
  # GHSA-3pq3-5fj3-cg6v, GHSA-542g-h47m-68v8, GHSA-c29m-xwm3-cm6r,
  # GHSA-mghh-pgcx-3jjj, GHSA-x97p-jq2g-jp4f and seven more, 1.19.0 → 1.20.0.
  axios: 1.21.0
  # GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg and GHSA-rgw5-rvv9-x895. The
  # 1.x line carries no fix for the later ones, so both lines resolve to
  # 5.0.9. Then GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7 (High) and
  # GHSA-q2hr-2g5m-vwhr, 5.0.9 → 5.0.12.
  brace-expansion: 5.0.12
  # GHSA-v2hh-gcrm-f6hx; then GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc,
  # GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp, GHSA-qw65-cvwx-89v3 (High)
  # and five Medium/Low, 4.1.2 → 4.2.3.
  fast-uri: 4.2.3
  # GHSA-5p4m-2wfm-xmqj. An override and not only a lockfile bump: a bump with
  # no range forcing it does not survive lockfile regeneration — the #104
  # rebase regenerated the lockfile and silently rolled this fix back.
  # GHSA-2883-xcg3-v3hh, 4.3.1 → 4.3.2.
  js-yaml: 4.3.2
  # GHSA-2v37-7h3g-55p8. Same regeneration story as js-yaml above.
  nanoid: 6.0.2
  # GHSA-r28c-9q8g-f849.
  postcss: 8.5.32
  # Transitive advisories closed in the security batch of 2026-11. Each pin is
  # inside the range its dependents declare (checked with `npm view`), so
  # these move a patch/minor within the same major; none changes a public
  # surface of a Kimen package.
  # GHSA-67c8-pqhq-4rmx (Critical), via ng-packagr (^5.0.0), 5.3.0 → 5.3.2.
  piscina: 5.3.2
  # GHSA-mcm9-63f2-9j32, GHSA-r9w8-h9r3-54w4, GHSA-x5rw-q4pp-hg5g,
  # GHSA-j22f-vq7h-c4qm (High) and four Medium/Low, via astro (^5.8.1),
  # 5.9.0 → 5.9.3.
  devalue: 5.9.4
  # GHSA-8r9p-f939-6h3c, GHSA-mrwp-f3q8-3g9p, GHSA-q3jh-wrc6-jgq8, via axios
  # and nx (^1.16.0), 1.16.0 → 1.16.2.
  follow-redirects: 1.16.2
  # GHSA-gjj5-9665-rwrc, via less (^7.2.3), 7.3.0 → 7.4.0.
  probe-image-size: 7.5.0
  # GHSA-7w5x-hrqm-74c2 (High) and GHSA-r4xh-jqrq-34v2, via astro, knip and
  # @astrojs/internal-helpers (^1.6.0 / ^1.7.1) and nx, which pins 1.6.1
  # exactly — same 1.x line, like the axios pin above crosses nx's 1.18.1.
  smol-toml: 1.9.1
  # GHSA-68fv-2mgg-jv7q, via postcss, @vue/compiler-* and sass (^1.2.1),
  # 1.2.1 → 1.2.2.
  source-map-js: 1.2.2
  # GHSA-w27v-7q3p-w38r (High) and GHSA-4vpr-x523-8j87, via astro (^4.0.2),
  # 4.0.2 → 4.1.0.
  svgo: 4.1.0
  # GHSA-587h-7wmj-h5pm (High) and five Medium/Low, via astro (^8.0.13),
  # vitest, storybook and unplugin-stencil (all accept 8.x), 8.2.0 → 8.2.4.
  vite: 8.3.5
  # GHSA-2wm5-q62r-hmrv, via stylelint (^2.9.3), 2.9.3 → 2.9.4.
  colord: 2.10.0
  # GHSA-rj75-hqrm-r3gf on both majors in the tree: postcss-nested wants
  # ^6.1.1, stylelint and @csstools want ^7.1.4.
  postcss-selector-parser@6: 7.1.7
  postcss-selector-parser@7: 7.1.7
  # Not an advisory: this holds the target of patches/minimatch@3.1.5.patch.
  # `patchedDependencies` names an exact version, and Renovate does not read
  # that field — but it does read these overrides, and lockFileMaintenance
  # regenerates the lockfile on a schedule. Without this pin a new 3.x release
  # would move the lockfile out from under the patch and break installs.
  # Unpin only together with regenerating the patch.
  minimatch@3: 3.1.5
  # GHSA-4mjr-xmp4-gh2g, GHSA-6pq8-jhm2-2vcw, GHSA-x5fp-wj9c-mxmx, 6.15.3 → 6.16.1.
  qs: 6.17.1
  # nx 23.3.1 pins undici 7.29.0 exactly. GHSA-4w7w-5xrc-9h26,
  # GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm, GHSA-w293-vg96-wgc3,
  # GHSA-xjj6-f33q-929c, GHSA-rfgv-xxqx-mfg5 (High) and seven Medium, all fixed
  # on the 7.x line by 7.30.1 (same major), like the smol-toml pin crossing
  # nx's exact 1.6.1. The 8.x line already resolves to a fixed 8.12.3.
  undici@7: 7.30.1
patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
# A dependency update may never silently downgrade security settings.
trustPolicy: no-downgrade
# Version-pinned exceptions for packages ALREADY resolved in the lockfile
# before this policy existed (added 2026-07-05). They re-admit exactly what
# main ships today; any other version stays subject to the full policy.
# semver@6.3.1: legacy babel/nx transitive, published (2023) after provenance
# began on the 7.x line, so no-downgrade can never pass for it.
trustPolicyExclude:
  - "semver@6.3.1"
minimumReleaseAgeExclude:
  # Renovate security update: fast-uri@3.1.5
  - fast-uri@3.1.5
  # Security update: GHSA-2v37-7h3g-55p8 (High), published 2026-08-03 —
  # inside the quarantine window, admitted explicitly like fast-uri above.
  - nanoid@3.3.17
  # Security update: GHSA-2v37-7h3g-55p8 (High), published 2026-08-03 —
  # inside the quarantine window, admitted explicitly like fast-uri above.
  - nanoid@3.3.17
